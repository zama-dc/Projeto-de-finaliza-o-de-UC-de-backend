  <script>
  //validação do formulário
      function validarLogin() {
        let email = document.getElementById("email_logar").value.trim();
        let senha = document.getElementById("pwd_logar").value.trim();

        if(email === "" && senha === ""){
            alert("Os campos email e senha estão vazios. Preencha-os.");
            return false;
        }        

        if (email.length < 3 || email === "") {
          alert("Volte ao campo email e digite corretamente.");
          return false;
        }
         if (senha.length < 3 || senha === "") {
          alert("Volte ao campo senha e digite corretamente.");
          return false;
        } 
        return true;
      }
</script>
