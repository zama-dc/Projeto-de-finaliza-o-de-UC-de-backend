  <script>
  //validação do formulário
  function valida() {
    /* VERIFICAR OS IDS!!! */
    /* FAZER O DO COMPLEMENTO!!! */
    let nome = document.getElementById("nome").value.trim();
    let email = document.getElementById("email").value.trim();
    let senha = document.getElementById("pwd").value.trim();

    if(email === "" && senha === "" && nome === ""){
        alert("Os campos nome, email e senha estão vazios. Preencha-os.");
        return false;
    }
    if (nome.length < 3 || nome === "") {
      alert("Volte ao campo nome e digite corretamente.");
      return false;
    }
    if (email.length < 3 || email === "") {
      alert("Volte ao campo email e digite corretamente.");
      return false;
    }
    if (senha.length < 3 || senha === "") {
      alert("Volte ao campo senha e digite corretamente.");
      return false;
    }

    let termos = document.getElementById("aceitarTermos").checked;
    if (!termos) {
      alert("Você precisa aceitar os termos e condições.");
      return false;
    }

    //se todos os campos forem válidos
     /* alert("Cadastrado com sucesso"); */    
    return true; 
  }
</script>
